# Issue Classification Labels
- name: 'Feature Request'
  color: '0e8a16'
  description: 'Feature request for the Google Mobile Ads Unity plugin.'

- name: 'Sample Issue'
  color: '1d76db'
  description: 'Issue related to sample code or sample applications.'

- name: 'Sdk Issue'
  color: 'd93f0b'

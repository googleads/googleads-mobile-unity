name: Migrate Labels

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (log changes without modifying labels)'
        type: boolean
        default: false
        required: true

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  migrate-labels:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      # actions/checkout v4.2.2
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

    - name: Migrate and Prune Labels
      # actions/github-script v7.0.1
      uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea
      with:
        script: |
          const dryRun =
            String(context.payload.inputs?.dry_run ?? 'false')
              .toLowerCase() === 'true';
          const owner = context.repo.owner;
          const repo = context.repo.repo;

          console.log(
            `Starting migration (dryRun=${dryRun}) on ${owner}/${repo}`
          );

          // 1. Ensure target labels exist
          const TARGET_LABELS = {
            'Feature Request': {
              color: '0e8a16',
              description:
                'Feature request for the Google Mobile Ads Unity plugin.',
            },
            'Sample Issue': {
              color: '1d76db',
              description:
                'Issue related to sample code or sample applications.',
            },
            'Sdk Issue': {
              color: 'd93f0b',
              description: 'Issue with the Google Mobile Ads SDK.',
            },
            'Product Issue': {
              color: 'ffa03e',
              description:
                'Issue with the AdMob or Google Ad Manager product/platform.',
            },
          };

          for (const [name, def] of Object.entries(TARGET_LABELS)) {
            try {
              await github.rest.issues.getLabel({ owner, repo, name });
              console.log(`Target label exists: ${name}`);
            } catch (err) {
              if (err.status === 404) {
                console.log(`Creating target label: ${name}`);
                if (!dryRun) {
                  await github.rest.issues.createLabel({
                    owner,
                    repo,
                    name,
                    color: def.color,
                    description: def.description,
                  });
                }
              } else {
                throw err;
              }
            }
          }

          // 2. Map old labels to new labels on issues and PRs
          const MAPPINGS = {
            'Feature': 'Feature Request',
            'Sample': 'Sample Issue',
            'SDK': 'Sdk Issue',
            'Plugin': 'Sdk Issue',
          };

          for (const [oldLabel, newLabel] of Object.entries(MAPPINGS)) {
            try {
              await github.rest.issues.getLabel({
                owner,
                repo,
                name: oldLabel,
              });
            } catch (err) {
              if (err.status === 404) {
                console.log(`Source label not found, skipping: ${oldLabel}`);
                continue;
              }
              throw err;
            }

            console.log(`Migrating "${oldLabel}" -> "${newLabel}"...`);
            const issues = await github.paginate(
              github.rest.issues.listForRepo,
              {
                owner,
                repo,
                labels: oldLabel,
                state: 'all',
                per_page: 100,
              }
            );

            console.log(`Found ${issues.length} issues with "${oldLabel}".`);
            for (const issue of issues) {
              const names = issue.labels.map(l =>
                typeof l === 'string' ? l : l.name
              );
              if (!names.includes(newLabel)) {
                console.log(`[#${issue.number}] Adding "${newLabel}"`);
                if (!dryRun) {
                  await github.rest.issues.addLabels({
                    owner,
                    repo,
                    issue_number: issue.number,
                    labels: [newLabel],
                  });
                }
              }
            }
          }

          // 3. Delete obsolete labels from repository
          const OBSOLETE_LABELS = [
            'Feature',
            'Sample',
            'SDK',
            'Plugin',
            'Formats',
            'Mediation',
            'P0',
            'P1',
            'P2',
            'P3',
            'Support',
            'wontfix',
          ];

          for (const label of OBSOLETE_LABELS) {
            try {
              await github.rest.issues.getLabel({
                owner,
                repo,
                name: label,
              });
              console.log(`Deleting obsolete label: "${label}"`);
              if (!dryRun) {
                await github.rest.issues.deleteLabel({
                  owner,
                  repo,
                  name: label,
                });
                console.log(`Deleted: "${label}"`);
              }
            } catch (err) {
              if (err.status === 404) {
                console.log(`Label already absent: "${label}"`);
              } else {
                throw err;
              }
            }
          }

          console.log('Migration completed successfully.');
